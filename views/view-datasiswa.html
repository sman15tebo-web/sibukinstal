<div class="d-flex flex-column flex-md-row justify-content-between mb-3 gap-2">
    <h3 class="m-0 text-secondary fw-bold">Data Siswa</h3>
    <div class="action-bar-mobile">
        <button class="btn btn-sm btn-info text-white admin-only" onclick="showImportSiswaPopup()"><i
                class="bi bi-upload"></i> Import</button>
        <button class="btn btn-sm btn-danger fw-bold admin-only" onclick="showHapusSemuaData()"><i
                class="bi bi-trash-fill"></i> Hapus Semua</button>
        <button class="btn btn-sm btn-success fw-bold admin-only" onclick="modalSiswa()"><i
                class="bi bi-person-plus-fill"></i> Tambah Siswa</button>
        <button class="btn btn-sm btn-outline-secondary shadow-sm fw-bold" onclick="refreshPage()"><i
                class="bi bi-arrow-clockwise"></i> <span class="mobile-hide">Segarkan</span></button>
    </div>
</div>
<ul class="nav nav-pills mb-3" id="pills-data-siswa" role="tablist">
    <li class="nav-item"><button class="nav-link active fw-bold text-white" style="background-color:#198754;"
            data-bs-toggle="pill" data-bs-target="#data-tab-aktif" type="button"><i
                class="bi bi-person-check-fill me-1"></i>Siswa Aktif</button></li>
    <li class="nav-item"><button class="nav-link fw-bold text-white" style="background-color:#0d6efd;"
            data-bs-toggle="pill" data-bs-target="#data-tab-alumni" type="button"><i
                class="bi bi-mortarboard-fill me-1"></i>Alumni</button></li>
    <li class="nav-item"><button class="nav-link fw-bold text-white" style="background-color:#dc3545;"
            data-bs-toggle="pill" data-bs-target="#data-tab-keluar" type="button"><i
                class="bi bi-box-arrow-right me-1"></i>Siswa Keluar</button></li>
    <li class="nav-item"><button class="nav-link fw-bold text-white" style="background-color:#6f42c1;"
            data-bs-toggle="pill" data-bs-target="#data-tab-kelas" type="button" onclick="loadKelas()"><i
                class="bi bi-buildings-fill me-1"></i><span class="d-none d-md-inline">Kelas Saat Ini</span><span
                class="d-md-none">Kelas</span></button></li>
</ul>
<div class="tab-content">
    <div class="tab-pane fade show active" id="data-tab-aktif">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
            <select id="filterUnifiedAktifKelas" class="form-select form-select-sm border-primary"
                style="max-width:220px" onchange="filterUnifiedTable('tblUnifiedAktif', 4, this.value)">
                <option value="">Semua Kelas Saat Ini</option>
            </select>
        </div>
        <div class="card p-4 bg-white shadow-sm border-0">
            <div class="table-responsive">
                <table id="tblUnifiedAktif" class="table table-hover w-100">
                    <thead class="table-light">
                        <tr>
                            <th>NIS / NISN</th>
                            <th>Nama Lengkap</th>
                            <th>Tgl Lahir</th>
                            <th>L/P</th>
                            <th>Kelas</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="tab-pane fade" id="data-tab-alumni">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3"><select id="filterUnifiedAlumniTahun"
                class="form-select form-select-sm border-primary" style="max-width:220px"
                onchange="filterUnifiedTable('tblUnifiedAlumni', 3, this.value)">
                <option value="">Semua Tahun Lulus</option>
                </select></div>
        <div class="card p-4 bg-white shadow-sm border-0">
            <div class="table-responsive">
                <table id="tblUnifiedAlumni" class="table table-hover w-100">
                    <thead class="table-light">
                        <tr>
                            <th>NIS / NISN</th>
                            <th>Nama Lengkap</th>
                            <th>L/P</th>
                            <th>Tahun Lulus</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="tab-pane fade" id="data-tab-keluar">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3"><select id="filterUnifiedKeluarTahun"
                class="form-select form-select-sm border-primary" style="max-width:220px"
                onchange="filterUnifiedTable('tblUnifiedKeluar', 3, this.value)">
                <option value="">Semua Tahun Keluar</option>
                </select></div>
        <div class="card p-4 bg-white shadow-sm border-0">
            <div class="table-responsive">
                <table id="tblUnifiedKeluar" class="table table-hover w-100">
                    <thead class="table-light">
                        <tr>
                            <th>NIS / NISN</th>
                            <th>Nama Lengkap</th>
                            <th>L/P</th>
                            <th>Tahun Keluar</th>
                            <th>Status</th>
                            <th>Alasan Keluar</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="tab-pane fade" id="data-tab-kelas">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 fw-bold text-secondary">Daftar Kelas</h5><button
                class="btn btn-sm btn-primary fw-bold admin-only" onclick="modalKelas()"><i
                    class="bi bi-plus-circle me-1"></i>Tambah Kelas</button>
        </div>
        <div class="card p-4 bg-white shadow-sm border-0">
            <div class="table-responsive">
                <table id="tblKelas" class="table table-hover w-100">
                    <thead class="table-light">
                        <tr>
                            <th>ID Kelas</th>
                            <th>Nama Kelas</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyKelas"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Kelas -->
<div class="modal fade" id="mdlKelas">
    <div class="modal-dialog" style="margin-top: 8vh;">
        <div class="modal-content">
            <form id="formKelas" onsubmit="saveKelas(event)">
                <div class="modal-header border-0 bg-light">
                    <h5 class="modal-title fw-bold text-secondary" id="lblModalKelas">Tambah Kelas</h5><button
                        type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="oldIdKelas">
                    <div class="mb-3"><label class="small fw-bold text-muted mb-1">ID Kelas *</label><input type="text"
                            class="form-control" id="idKelas" required placeholder="Contoh: 1XIPA"></div>
                    <div class="mb-3"><label class="small fw-bold text-muted mb-1">Nama Kelas *</label><input
                            type="text" class="form-control" id="nmKelas" required placeholder="Contoh: X IPA 1"></div>
                </div>
                <div class="modal-footer border-0 bg-light"><button type="button" class="btn btn-light shadow-sm"
                        data-bs-dismiss="modal">Batal</button><button type="submit"
                        class="btn btn-primary shadow-sm fw-bold"><i class="bi bi-save me-1"></i>Simpan</button></div>
            </form>
        </div>
    </div>
</div>
